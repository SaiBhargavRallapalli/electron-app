version: '3.8'

services:
  youtube-downloader-api:
    build:
      context: .
      dockerfile: electron-app/Dockerfile
    container_name: youtube-downloader-api
    ports:
      - "3001:3001"
    volumes:
      - ./downloads:/app/downloads
      - ./config:/app/config
    environment:
      - API_PORT=3001
      - API_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add a reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - youtube-downloader-api
  #   restart: unless-stopped

volumes:
  downloads:
  config: